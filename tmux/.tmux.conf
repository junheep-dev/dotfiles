# left command should be binded to C-M-b via Karabiner
set -g prefix C-M-b
set -g prefix2 C-b
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 0
set-option -g focus-events on
set -g extended-keys on

# set title of the terminal window
set -g set-titles on
set-option -g set-titles-string "#S - #I #W"

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind c new-window -c "#{pane_current_path}"
bind C new-window -a -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

setw -g mode-keys vi

set -g history-limit 10000

set -s copy-command 'pbcopy'
# https://github.com/tmux/tmux/issues/140#issuecomment-474341833
# disable "release mouse drag to copy and exit copy-mode", ref: https://github.com/tmux/tmux/issues/140
unbind-key -T copy-mode-vi MouseDragEnd1Pane
# since MouseDragEnd1Pane neither exit copy-mode nor clear selection now,
# let single click do selection clearing for us.
bind-key -T copy-mode-vi MouseDown1Pane select-pane\; send-keys -X clear-selection
# this line changes the default binding of MouseDrag1Pane, the only difference
# is that we use `copy-mode -eM` instead of `copy-mode -M`, so that WheelDownPane
# can trigger copy-mode to exit when copy-mode is entered by MouseDrag1Pane
bind -n MouseDrag1Pane if -Ft= '#{mouse_any_flag}' 'if -Ft= \"#{pane_in_mode}\" \"copy-mode -eM\" \"send-keys -M\"' 'copy-mode -eM'

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi 'Enter' send -X cancel

# viw / viW text objects, ref: https://github.com/tmux/tmux/issues/1820
# guard on selection_active, not selection_present: the latter stays 0 until
# the cursor moves after 'v', so 'viw' would do nothing
bind-key -T copy-mode-vi 'i' switch-client -T text-object
bind-key -T text-object 'w' if -F '#{selection_active}' { send -X select-word }
# emptying word-separators makes select-word span a WORD
bind-key -T text-object 'W' if -F '#{selection_active}' { set -g word-separators '' ; send -X select-word ; set -gu word-separators }

bind-key -r -T prefix Up resize-pane -U 5
bind-key -r -T prefix Down resize-pane -D 5
bind-key -r -T prefix Left resize-pane -L 5
bind-key -r -T prefix Right resize-pane -R 5
bind-key -r -T prefix S-Up resize-pane -U
bind-key -r -T prefix S-Down resize-pane -D
bind-key -r -T prefix S-Left resize-pane -L
bind-key -r -T prefix S-Right resize-pane -R

# Custom layouts: big pane on the left (M-h) or right (M-l).
# main-vertical-mirrored is avoided because it numbers the main (right) pane
# first; this keeps pane numbers in visual order (left column top-down, then
# the big right pane last).
bind-key M-h select-layout main-vertical \; resize-pane -t 1 -x 50%
bind-key M-l run-shell 'w="#{window_id}"; n=#{window_panes}; tmux select-layout -t "$w" even-horizontal; i=2; while [ "$i" -lt "$n" ]; do tmux move-pane -v -s "$w.$i" -t "$w.$((i-1))"; i=$((i+1)); done; [ "$n" -gt 2 ] && tmux select-layout -E -t "$w.1"; tmux resize-pane -t "$w.$n" -x 50%'

# btop toggle: prefix + b switches to a persistent _btop session and back, so
# btop keeps running (graph history intact) between visits. This used to be a
# display-popup, but a popup overlays panes that keep redrawing underneath it,
# and tmux repaints the slivers left beside it on the same rows as the border —
# which made the border shimmer, then drop out, under a busy TUI.
# detach-on-destroy is set on _btop alone: quitting btop with q destroys the
# session, and the default would detach the client from tmux entirely.
bind b if-shell -F '#{==:#{session_name},_btop}' 'switch-client -l' 'new-session -A -d -s _btop btop ; set -t _btop detach-on-destroy off ; switch-client -t _btop'

# Load statusbar
source-file ~/.tmux/tmux.statusbar.conf

# Plugins
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @scroll-speed-num-lines-per-scroll "2"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TPM. See https://github.com/tmux-plugins/tpm
run '~/.tmux/plugins/tpm/tpm'
