# Load theme variables
source-file ~/.tmux/tmux.theme.conf

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 100

# bg=default keeps the bar transparent so it blends into the terminal background
set -gF status-style "none,bg=default,fg=#{@theme-fg}"
set -g status-left-style none
set -g status-right-style none

set -g status-left "#[fg=#{@theme-bg},bg=#{@theme-primary},bold] #S #[none,bg=default] "
set -g status-right "#[fg=#{@theme-primary}]#(~/.local/bin/agent-status render-sessions \"#{session_name}\")#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}"

setw -g window-status-separator ""
setw -gF window-status-style "none,fg=#{@theme-fg-muted}"
setw -g window-status-format "#[fg=#{@theme-fg-muted}] #I:#W#(~/.local/bin/agent-status render \"#{window_id}\") "
setw -g window-status-current-format "#[fg=#{@theme-fg-active},bold] #I:#W#(~/.local/bin/agent-status render \"#{window_id}\") "
setw -g window-status-activity-style none

set-hook -g pane-focus-in[90] 'run-shell "~/.local/bin/agent-status acknowledge-pane \"#{pane_id}\""'
set-hook -g pane-exited[90] 'run-shell "~/.local/bin/agent-status remove-pane \"#{hook_pane}\""'
run-shell -b "~/.local/bin/agent-status prune"

set -gF pane-border-style "fg=#{@theme-fg-muted}"
set -gF pane-active-border-style "fg=#{@theme-primary}"

set -gF message-style "bg=default,fg=#{@theme-primary}"
set -gF message-command-style "bg=default,fg=#{@theme-primary}"
set -gF mode-style "bg=#{@theme-primary},fg=#{@theme-bg}"
setw -gF clock-mode-colour "#{@theme-primary}"
